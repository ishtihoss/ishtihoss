name: refresh profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate gunmetal streak card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077
        with:
          options: user=${{ github.repository_owner }}&hide_border=false&background=135,0C1115,151C21&border=344149&stroke=263139&ring=50C878&fire=0C1115&currStreakNum=D5DCE1&currStreakLabel=50C878&sideNums=D5DCE1&sideLabels=8B979F&dates=66727B&border_radius=4&timezone=America/Vancouver&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
