name: refresh profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate holo streak card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077
        with:
          options: user=${{ github.repository_owner }}&hide_border=false&background=135,04070D,0F1B2E&border=2C4262&stroke=1E3049&ring=FF9E2C&fire=FF9E2C&currStreakNum=E6EDF5&currStreakLabel=FF9E2C&sideNums=E6EDF5&sideLabels=8FA3BB&dates=52657C&border_radius=4&timezone=America/Vancouver&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
