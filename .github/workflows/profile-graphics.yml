name: refresh profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch contribution telemetry
        run: |
          mkdir -p dist
          node tools/fetch-telemetry.mjs "${{ github.repository_owner }}" > dist/telemetry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ_NAME: America/Vancouver

      - name: Render telemetry panel
        run: node tools/build-telemetry.mjs dist/telemetry.json dist/telemetry.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
