name: generate profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # let me run it on demand
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate emerald streak card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077
        with:
          options: user=${{ github.repository_owner }}&hide_border=false&background=000000&border=0D3B1E&stroke=0D3B1E&ring=00FF41&fire=00FF41&currStreakNum=C9D1D9&currStreakLabel=00FF41&sideNums=C9D1D9&sideLabels=C9D1D9&dates=666666&border_radius=8&timezone=America/Vancouver&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate emerald contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300ff41&color_dots=%23000000,%23003311,%23006622,%2300cc33,%2300ff41
            dist/snake.svg?palette=github-dark&color_snake=%2300ff41&color_dots=%23000000,%23003311,%23006622,%2300cc33,%2300ff41

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
